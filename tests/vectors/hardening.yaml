---
# Shared data for rules that must mean the same thing in both runtimes.
# Adapter-specific filesystem and model-loader cases remain ordinary unit tests.
artifact_input:
  - { id: missing, source: missing, outcome: input_error, code: artifact_unreadable }
  - { id: invalid_utf8, source: invalid_utf8, outcome: input_error, code: artifact_invalid_utf8 }
  - { id: malformed_yaml, text: "movie: [", outcome: invalid, code: yaml_parse_error }

frontmatter:
  - id: indented_delimiter_in_block_scalar
    text: |
      ---
      movie:
        notes: |
          first line
          ---
          more text
        count: 3
      ---
      body
    expected: { notes: "first line\n---\nmore text\n", count: 3 }
  # U+0085, U+2028 and U+2029 may appear only as double-quoted escapes (`\N`, `\L`, `\P`),
  # which both engines decode to the same characters; raw, the portable preflight rejects
  # them (see `portable_values`). The fence scan must not split on them either: both readers
  # split on "\n" alone. Python's `str.splitlines()` would cut a raw one out of its line and
  # rejoin the block with real newlines, hiding it from the preflight and folding the scalar
  # into a multi-line value where TypeScript rejects the file.
  - id: escaped_line_separators_in_scalar
    text: "---\nmovie:\n  notes: \"line\\Lseparator\\Pparagraph\\Nnext\"\n  count: 3\n---\nbody\n"
    expected: { notes: "line\u2028separator\u2029paragraph\u0085next", count: 3 }
  # A fence is `---` plus optional trailing spaces or tabs (and a CRLF document's `\r`).
  - id: fence_with_trailing_blanks
    text: "--- \t\nmovie:\n  title: Spirited Away\n  count: 3\n---\t \nbody\n"
    expected: { title: Spirited Away, count: 3 }
  - id: crlf_document
    text: "---\r\nmovie:\r\n  title: Spirited Away\r\n  count: 3\r\n---\r\nbody\r\n"
    expected: { title: Spirited Away, count: 3 }

# Frontmatter-md documents the fence scan must refuse identically. Only space and tab are
# trimmed before a line is compared with `---`: the hosts' default trims disagree
# (`str.rstrip()` strips U+0085 and U+001C-U+001F, `trimEnd()` strips U+FEFF), and a fence
# line is never seen by the preflight, so with the default trims a `---` followed by U+0085
# opened a fence in one runtime and no fence in the other. Each case names the record `kind`
# both runtimes report under a frontmatter-md contract.
fence_scan:
  - id: opening_fence_next_line
    text: "---\u0085\nmovie:\n  title: x\n---\nbody\n"
    code: no_frontmatter
  - id: opening_fence_bom
    text: "---\ufeff\nmovie:\n  title: x\n---\nbody\n"
    code: no_frontmatter
  - id: opening_fence_file_separator
    text: "---\u001c\nmovie:\n  title: x\n---\nbody\n"
    code: no_frontmatter
  # The line is not a fence, so the block runs to the end of the file.
  - id: closing_fence_next_line
    text: "---\nmovie:\n  title: x\n---\u0085\nbody\n"
    code: yaml_parse_error
  # The line is not a fence, so it is part of the block, where the preflight rejects it.
  - id: closing_fence_next_line_then_real_fence
    text: "---\nmovie:\n  title: x\n---\u0085\nextra: 1\n---\nbody\n"
    code: yaml_parse_error
  # A block holding only a rejected character is not empty: `strip()` would drop a NEL and
  # call the block empty (no_frontmatter) where `trim()` keeps it and the preflight rejects it.
  - id: block_of_one_next_line
    text: "---\n\u0085\n---\nbody\n"
    code: yaml_parse_error

portable_values:
  - id: plain_values
    text: |
      text: hello
      count: 42
      ratio: 1.5
      enabled: true
      empty: null
    valid: true
  - { id: timestamp, text: "value: 2026-07-11", valid: true, expected: { value: "2026-07-11" } }
  - { id: invalid_timestamp, text: "value: 2001-13-99", valid: true, expected: { value: "2001-13-99" } }
  - { id: spaced_timestamp, text: "value: 2001-12-14 21:59:43", valid: true, expected: { value: "2001-12-14 21:59:43" } }
  - { id: offset_timestamp, text: "value: 2026-05-16T13:10:10-07:00", valid: true, expected: { value: "2026-05-16T13:10:10-07:00" } }
  - { id: precise_timestamp, text: "value: 2026-05-12 13:10:10.123456789 +05:30", valid: true, expected: { value: "2026-05-12 13:10:10.123456789 +05:30" } }
  - { id: quoted_timestamp, text: "value: '2026-07-11'", valid: true, expected: { value: "2026-07-11" } }
  - { id: timestamp_key, text: "2026-07-11: value", valid: true, expected: { "2026-07-11": value } }
  - id: duplicate_key
    text: "value: first\nvalue: second"
    valid: false
    code: yaml_duplicate_key
  - id: alias
    text: "first: &value hello\nsecond: *value"
    valid: false
    code: yaml_alias
  - id: merge_key
    text: "base: &base {name: Ada}\nuser: {<<: *base}"
    valid: false
    code: yaml_merge_key
  - { id: custom_tag, text: "value: !thing hello", valid: false, code: yaml_custom_tag }
  # A lone carriage return is a YAML line break for ruamel and content for the `yaml`
  # package, so a CR-only document is two keys in one runtime and a parse error in the
  # other, and a CR inside a flow scalar is a space in one and a character in the other.
  # Raw, it is rejected like U+0085; `\r\n` passes, and the escape `"\r"` decodes identically.
  - { id: lone_cr_between_keys, text: "value: 1\rother: 2", valid: false, code: yaml_parse_error }
  - { id: lone_cr_in_flow_scalar, text: "value: \"a\rb\"", valid: false, code: yaml_parse_error }
  - { id: lone_cr_in_block_scalar, text: "value: |\n  a\rb\n", valid: false, code: yaml_parse_error }
  - { id: crlf_line_endings, text: "value: 1\r\nother: 2\r\n", valid: true, expected: { value: 1, other: 2 } }
  - { id: escaped_cr, text: "value: \"a\\rb\"", valid: true, expected: { value: "a\rb" } }
  # A raw tab is read by both engines inside a quoted scalar, a block scalar, a comment, and
  # as spacing inside a flow collection. In a plain scalar or as block-context spacing one
  # engine refuses it (YAML 1.2 allows it), so both reject it there.
  - { id: tab_in_plain_scalar, text: "value: a\tb", valid: false, code: yaml_parse_error }
  - { id: tab_after_plain_scalar, text: "value: a\t", valid: false, code: yaml_parse_error }
  - { id: tab_after_colon, text: "value:\ta", valid: false, code: yaml_parse_error }
  - { id: tab_in_key, text: "va\tlue: a", valid: false, code: yaml_parse_error }
  - { id: tab_on_blank_line, text: "value: a\n\t\nother: b", valid: false, code: yaml_parse_error }
  - { id: tab_in_double_quoted, text: "value: \"a\tb\"", valid: true, expected: { value: "a\tb" } }
  - { id: tab_in_single_quoted, text: "value: 'a\tb'", valid: true, expected: { value: "a\tb" } }
  - { id: tab_in_block_scalar, text: "value: |\n  a\tb\n", valid: true, expected: { value: "a\tb\n" } }
  - { id: tab_in_comment, text: "value: a # c\td", valid: true, expected: { value: a } }
  - { id: tab_as_flow_spacing, text: "value: [a,\tb]", valid: true, expected: { value: [a, b] } }
  # Block context resumes after a block scalar header, a closing quote, and a flow
  # collection's closing bracket, so a tab there is block-context spacing; before the
  # bracket it is still flow spacing, and inside the header's comment it is comment text.
  - { id: tab_after_block_scalar_header, text: "value: |\t\n  a\n", valid: false, code: yaml_parse_error }
  - { id: tab_between_block_scalar_header_and_comment, text: "value: |\t# c\n  a\n", valid: false, code: yaml_parse_error }
  - { id: tab_in_block_scalar_header_comment, text: "value: |  # c\td\n  a\n", valid: true, expected: { value: "a\n" } }
  - { id: tab_after_flow_collection, text: "value: [a, b]\t", valid: false, code: yaml_parse_error }
  - { id: tab_after_flow_collection_before_comment, text: "value: {a: 1}\t# c", valid: false, code: yaml_parse_error }
  - { id: tab_after_root_flow_collection, text: "{\"value\": 1}\t", valid: false, code: yaml_parse_error }
  - { id: tab_before_flow_collection_end, text: "value: [a, b\t]", valid: true, expected: { value: [a, b] } }
  - { id: tab_after_nested_flow_collection, text: "value: [[a]\t, b]", valid: true, expected: { value: [[a], b] } }
  - { id: tab_after_quoted_scalar, text: "value: \"a\"\t", valid: false, code: yaml_parse_error }
  # YAML 1.2 requires each later line of a flow collection or quoted scalar in block context
  # to be indented with spaces past its parent block; one engine enforces this and the other
  # does not, so both reject such a line. A tab does not count as indentation, a blank or
  # comment line is exempt, the outermost closing bracket may sit at the parent's column,
  # and a root flow collection (a JSON document) has no required indentation.
  - { id: tab_indents_quoted_continuation, text: "value: \"first\n\tsecond\"", valid: false, code: yaml_parse_error }
  - { id: tab_indents_flow_continuation, text: "value: [a,\n\tb]", valid: false, code: yaml_parse_error }
  - { id: under_indented_quoted_continuation, text: "outer:\n  value: \"first\n second\"", valid: false, code: yaml_parse_error }
  - { id: under_indented_single_quoted_continuation, text: "outer:\n  value: 'first\n  second'", valid: false, code: yaml_parse_error }
  - { id: under_indented_flow_continuation, text: "outer:\n  value: [a,\n b]", valid: false, code: yaml_parse_error }
  - { id: under_indented_flow_mapping_continuation, text: "- {a: 1,\nb: 2}", valid: false, code: yaml_parse_error }
  - { id: indented_quoted_continuation, text: "outer:\n  value: \"first\n   \tsecond\"", valid: true, expected: { outer: { value: "first second" } } }
  - { id: indented_flow_continuation, text: "outer:\n  value: [a,\n   \tb]", valid: true, expected: { outer: { value: [a, b] } } }
  - { id: flow_end_at_parent_column, text: "outer:\n  value: [a,\n    b\n  ]", valid: true, expected: { outer: { value: [a, b] } } }
  - { id: flow_comment_line_at_any_indent, text: "outer:\n  value: [a,\n# note\n    b]", valid: true, expected: { outer: { value: [a, b] } } }
  - { id: blank_line_in_quoted_continuation, text: "outer:\n  value: \"first\n\n    second\"", valid: true, expected: { outer: { value: "first\nsecond" } } }
  - { id: root_flow_tab_indent, text: "{\"a\": 1,\n\t\"b\": [2,\n\t\t3]}", valid: true, expected: { a: 1, b: [2, 3] } }
  # A plain `=` is the string `=` (YAML 1.2); one engine still resolves it to the YAML 1.1
  # `!!value` key and had no constructor for it.
  - { id: plain_equals, text: "value: =", valid: true, expected: { value: "=" } }
  # Two `\u` escapes forming a surrogate pair are the one character they encode, as in
  # JSON; one engine works in UTF-16 and reads them so natively, the other is made to agree.
  # A surrogate that pairs with nothing stays a lone surrogate and is rejected.
  - { id: escaped_surrogate_pair, text: "value: \"a\\ud83d\\ude00b\"", valid: true, expected: { value: "a😀b" } }
  - { id: escaped_lone_surrogate, text: "value: \"a\\ud83db\"", valid: false, code: yaml_unsupported_scalar }
  - { id: escaped_reversed_surrogates, text: "value: \"\\ude00\\ud83d\"", valid: false, code: yaml_unsupported_scalar }
  - { id: non_string_key, text: "1: one", valid: false, code: yaml_non_string_key }
  - { id: unsafe_integer, text: "value: 9007199254740992", valid: false, code: number_out_of_range }
  # Raw characters the two engines read differently are rejected before parsing, in both
  # runtimes: everything outside YAML 1.2 `c-printable` (ruamel rejects these itself; the
  # `yaml` package reads them as content), plus U+0085, U+2028 and U+2029, which ruamel
  # treats as YAML 1.1 line breaks (a NEL folds to a space in a flow scalar, and any of the
  # three breaks a block scalar or a comment) and the `yaml` package treats as content.
  # Written as double-quoted escapes they decode identically, so that is the portable form.
  - { id: raw_form_feed, text: "value: a\fb", valid: false, code: yaml_parse_error }
  - { id: raw_vertical_tab_in_comment, text: "value: 1 # note\vmore", valid: false, code: yaml_parse_error }
  - { id: raw_delete_in_key, text: "a\x7fb: 1", valid: false, code: yaml_parse_error }
  - { id: raw_next_line, text: "value: before\x85after", valid: false, code: yaml_parse_error }
  - { id: raw_next_line_in_quoted_scalar, text: "value: \"before\x85after\"", valid: false, code: yaml_parse_error }
  - { id: raw_line_separator, text: "value: a\u2028b", valid: false, code: yaml_parse_error }
  - { id: raw_paragraph_separator_in_block_scalar, text: "value: |\n  a\u2029b\n", valid: false, code: yaml_parse_error }
  - { id: escaped_control_characters, text: "value: \"a\\fb\\vc\\x7fd\"", valid: true, expected: { value: "a\fb\vc\x7fd" } }
  - { id: escaped_line_separators, text: "value: \"a\\Nb\\Lc\\Pd\"", valid: true, expected: { value: "a\x85b\u2028c\u2029d" } }
  - { id: negative_zero, text: "value: -0.0", valid: false, code: number_negative_zero }
  # `-0` is negative zero to an engine that reads numbers as doubles and plain zero to one
  # that reads integers exactly; it is rejected as negative zero in both. `-0x0`, `-0o0`,
  # and `+0` are not negative-zero literals.
  - { id: negative_zero_integer, text: "value: -0", valid: false, code: number_negative_zero }
  - { id: negative_zero_integer_padded, text: "value: [-00]", valid: false, code: number_negative_zero }
  - { id: json_negative_zero_integer, text: '{"value": -0}', valid: false, code: number_negative_zero }
  - { id: positive_zero_integer, text: "value: +0", valid: true, expected: { value: 0 } }
  - { id: quoted_negative_zero, text: "value: '-0'", valid: true, expected: { value: "-0" } }
  # An implicit key's `:` must be on the line the key starts on and at most 1,024 characters
  # after it, in a flow mapping as in a block mapping (one engine applies the limit only in
  # block context, as YAML 1.2 does). The distance is counted in characters; the quotes count.
  - { id: flow_mapping_key_at_limit, generated: long_flow_key, length: 1022, valid: true }
  - { id: flow_mapping_key_over_limit, generated: long_flow_key, length: 1023, valid: false, code: yaml_parse_error }
  - { id: flow_mapping_key_astral_at_limit, generated: long_flow_key, length: 1022, key_char: "\U0001F600", valid: true }
  - { id: json_key_over_limit, generated: long_flow_key, length: 1100, json: true, valid: false, code: yaml_parse_error }
  - { id: flow_mapping_key_colon_on_next_line, text: "value: {\"a\"\n  : 1}", valid: false, code: yaml_parse_error }
  - { id: json_key_colon_on_next_line, text: "{\"a\"\n: 1}", valid: false, code: yaml_parse_error }
  - { id: flow_mapping_multiline_key, text: "value: {a\n  b: 1}", valid: false, code: yaml_parse_error }
  # For a block-mapping key and a flow-sequence pair, one engine counts the 1,024 in UTF-16
  # code units, so both do: 512 characters outside the Basic Multilingual Plane reach it.
  - { id: block_key_astral_at_utf16_limit, generated: long_key, form: block, key_char: "\U0001F600", length: 512, valid: true }
  - { id: block_key_astral_over_utf16_limit, generated: long_key, form: block, key_char: "\U0001F600", length: 513, valid: false, code: yaml_parse_error }
  - { id: flow_pair_key_astral_at_utf16_limit, generated: long_key, form: pair, key_char: "\U0001F600", length: 512, valid: true }
  - { id: flow_pair_key_astral_over_utf16_limit, generated: long_key, form: pair, key_char: "\U0001F600", length: 513, valid: false, code: yaml_parse_error }
  # A plain scalar one engine reads as a number and the other as a string is refused: ruamel
  # still takes YAML 1.1 spellings (`_` separators, `0b`, a signed `0x` or `0o`) as numbers,
  # and reads `.5e3` (an unsigned exponent after a bare fraction) as a string, where the
  # YAML 1.2 core schema does the reverse. Core-form numbers and quoted strings are unchanged.
  - { id: integer_with_underscores, text: "value: 1_000", valid: false, code: yaml_unsupported_scalar }
  - { id: float_with_underscores, text: "value: 1_0.5", valid: false, code: yaml_unsupported_scalar }
  - { id: binary_integer, text: "value: 0b101", valid: false, code: yaml_unsupported_scalar }
  - { id: negative_hex_integer, text: "value: -0x10", valid: false, code: yaml_unsupported_scalar }
  - { id: positive_hex_integer, text: "value: +0x10", valid: false, code: yaml_unsupported_scalar }
  - { id: negative_octal_integer, text: "value: -0o17", valid: false, code: yaml_unsupported_scalar }
  - { id: bare_fraction_unsigned_exponent, text: "value: .5e3", valid: false, code: yaml_unsupported_scalar }
  - { id: sign_and_underscore, text: "value: -_", valid: false, code: yaml_unsupported_scalar }
  - { id: number_form_key, text: "1_000: x", valid: false, code: yaml_unsupported_scalar }
  - { id: string_number_form_key, text: ".5e3: x", valid: false, code: yaml_unsupported_scalar }
  - { id: number_form_in_flow_sequence, text: "value: [1, 0b11]", valid: false, code: yaml_unsupported_scalar }
  - { id: core_hex_integer, text: "value: 0x10", valid: true, expected: { value: 16 } }
  - { id: core_octal_integer, text: "value: 0o17", valid: true, expected: { value: 15 } }
  - { id: leading_zero_decimal, text: "value: 017", valid: true, expected: { value: 17 } }
  - { id: plain_integer, text: "value: 1000", valid: true, expected: { value: 1000 } }
  - { id: core_exponent_float, text: "value: 1.5e3", valid: true, expected: { value: 1500 } }
  - { id: signed_bare_fraction_signed_exponent, text: "value: +.5e-3", valid: true, expected: { value: 0.0005 } }
  - { id: quoted_underscore_number, text: "value: '1_000'", valid: true, expected: { value: "1_000" } }
  - { id: double_quoted_binary_number, text: "value: \"0b101\"", valid: true, expected: { value: "0b101" } }
  - { id: sexagesimal_is_a_string, text: "value: 1:30", valid: true, expected: { value: "1:30" } }
  - { id: yaml_1_1_boolean_is_a_string, text: "value: yes", valid: true, expected: { value: "yes" } }
  - { id: plain_negative_infinity, text: "value: -.inf", valid: false, code: number_out_of_range }
  # Only `%YAML 1.2` and `%TAG` are accepted. Under `%YAML 1.1` the engines' YAML 1.1
  # schemas disagree (`08` is a string to one and 8 to the other), one engine fails on other
  # versions, and one refuses an unknown directive the other ignores.
  - { id: yaml_1_1_directive, text: "%YAML 1.1\n---\nvalue: 08", valid: false, code: yaml_parse_error }
  - { id: yaml_1_0_directive, text: "%YAML 1.0\n---\nvalue: x", valid: false, code: yaml_parse_error }
  - { id: yaml_1_3_directive, text: "%YAML 1.3\n---\nvalue: x", valid: false, code: yaml_parse_error }
  - { id: unknown_directive, text: "%FOO bar\n---\nvalue: x", valid: false, code: yaml_parse_error }
  - { id: yaml_1_2_directive, text: "%YAML 1.2\n---\nvalue: 08", valid: true, expected: { value: 8 } }
  - { id: tag_directive, text: "%TAG !e! tag:example.com,2000:\n---\nvalue: x", valid: true, expected: { value: x } }
  - { id: depth_63, generated: deep_sequence, depth: 63, valid: true }
  - { id: depth_64, generated: deep_sequence, depth: 64, valid: false, code: yaml_limit }
  - { id: depth_65, generated: deep_sequence, depth: 65, valid: false, code: yaml_limit }
  - { id: excessive_depth, generated: deep_sequence, depth: 1000, valid: false, code: yaml_limit }
  - { id: hostile_depth, generated: deep_sequence, depth: 50000, valid: false, code: yaml_limit }
  # A JSON document is a YAML document and keeps its YAML meaning, including where the
  # two languages disagree: NaN is a plain scalar string, and duplicate keys fail.
  - id: json_document
    text: '{"text": "hello", "count": 42, "ratio": 1.5, "enabled": true, "empty": null, "items": [1, "two"]}'
    valid: true
    expected: { text: hello, count: 42, ratio: 1.5, enabled: true, empty: null, items: [1, two] }
  - id: json_quoted_scalars
    text: '{"date": "2026-07-11", "flag": "yes", "nothing": "null", "number": "1e5"}'
    valid: true
    expected: { date: "2026-07-11", flag: "yes", nothing: "null", number: "1e5" }
  - { id: json_nan, text: '{"value": NaN}', valid: true, expected: { value: "NaN" } }
  - { id: json_duplicate_key, text: '{"value": "first", "value": "second"}', valid: false, code: yaml_duplicate_key }
  - { id: json_merge_key, text: '{"<<": {"name": "Ada"}}', valid: false, code: yaml_merge_key }
  - { id: json_unsafe_integer, text: '{"value": 9007199254740992}', valid: false, code: number_out_of_range }
  - { id: json_negative_zero, text: '{"value": -0.0}', valid: false, code: number_negative_zero }
  - { id: json_lone_surrogate, text: '{"value": "\ud800"}', valid: false, code: yaml_unsupported_scalar }

structural:
  - id: format_is_annotation
    schema: { type: string, format: email }
    value: not-an-email
    valid: true
  - id: date_format_is_annotation
    schema: { type: string, format: date }
    value: "2001-13-99"
    valid: true
  - id: date_pattern_is_assertion
    schema: { type: string, format: date, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-[0-9]{2}$" }
    value: "2001-13-99"
    valid: false
    code: schema_violation
  - id: portable_pattern
    schema: { type: string, pattern: "^[a-z]+$" }
    value: abc
    valid: true
  - id: unsupported_pattern
    schema: { type: string, pattern: "(?<=a)b" }
    value: ab
    valid: false
    code: schema_invalid
    reason: pattern
  - id: invalid_pattern
    schema: { type: string, pattern: "[" }
    value: anything
    valid: false
    code: schema_invalid
    reason: pattern
  - id: invalid_pattern_properties
    schema: { type: object, patternProperties: { "[": { type: string } } }
    value: { name: Ada }
    valid: false
    code: schema_invalid
    reason: pattern
  - id: invalid_pattern_in_resource
    schema: { $ref: "urn:example:pattern" }
    resources:
      urn:example:pattern:
        { $id: "urn:example:pattern", type: string, pattern: "(?P<name>a)" }
    value: a
    valid: false
    code: schema_invalid
    reason: pattern
  - id: unresolved_remote_reference
    schema: { $ref: "https://example.invalid/remote-schema" }
    value: anything
    valid: false
    code: schema_invalid
  - id: local_resource
    schema: { $ref: "urn:example:name" }
    resources:
      urn:example:name: { $id: "urn:example:name", type: string, minLength: 1 }
    value: Ada
    valid: true
  - id: embedded_anchor
    schema:
      $defs:
        name: { $anchor: Name, type: string, minLength: 1 }
      $ref: "#Name"
    value: Ada
    valid: true
  - id: duplicate_resource_id
    schema: { $ref: "urn:example:name" }
    resources:
      first: { $id: "urn:example:name", type: string }
      second: { $id: "urn:example:name", type: integer }
    value: Ada
    valid: false
    code: schema_invalid
  # A resource is identified by its $id, or by its key when it has none; a urn: identity
  # must name a namespace identifier in either place.
  - id: urn_resource_id_without_namespace
    schema: { $ref: "urn:example:item" }
    resources:
      "urn:example:item": { $id: "urn:example", type: string }
    value: Ada
    valid: false
    code: schema_invalid
    reason: resource_identity
  - id: urn_resource_key_without_namespace
    schema: { $ref: "urn:example" }
    resources:
      "urn:example": { type: string }
    value: Ada
    valid: false
    code: schema_invalid
    reason: resource_identity
  - id: urn_resource_key_with_namespace
    schema: { $ref: "urn:example:item" }
    resources:
      "urn:example:item": { type: string }
    value: Ada
    valid: true
  # A resource identity in a spelling fast-uri normalizes would be registered under one
  # URI by Ajv and another by Python; the identity grammar refuses it in either place.
  - id: uppercase_host_resource_key
    schema: { $ref: "https://EXAMPLE.com/X" }
    resources:
      "https://EXAMPLE.com/X": { type: string }
    value: Ada
    valid: false
    code: schema_invalid
    reason: resource_identity
  - id: escaped_unreserved_resource_key
    schema: { $ref: "https://example.com/%7Euser/x.json" }
    resources:
      "https://example.com/%7Euser/x.json": { type: string }
    value: Ada
    valid: false
    code: schema_invalid
    reason: resource_identity
  - id: uppercase_scheme_resource_id
    schema: { $ref: "urn:example:b" }
    resources:
      "urn:example:b": { $id: "URN:example:b", type: string }
    value: Ada
    valid: false
    code: schema_invalid
    reason: resource_identity
  - id: https_resource_key
    schema: { $ref: "https://example.com/schemas/name.json" }
    resources:
      "https://example.com/schemas/name.json": { type: string }
    value: Ada
    valid: true

canonicalization:
  - id: preserve_empty_default
    before: { type: object, properties: { items: { type: array, default: [] } } }
    after: { type: object, properties: { items: { type: array, default: [] } } }
  - id: nested_dependent_schema
    before: { type: object, dependentSchemas: { credit_card: { title: Billing, type: object } } }
    after: { type: object, dependentSchemas: { credit_card: { title: Billing, type: object } } }

# The enforced-closure overlay. `closure` is the keyword the overlay must inject at the
# schema root (`none` = the root must stay open); `defs_closure` pins the same for named
# `$defs` entries. Reusable definition roots stay open; each `$ref` application site is
# closed independently. Asserting the keyword, not merely that closure happened, keeps
# the applicator split honest: in-place applicators are never closed internally and
# force `unevaluatedProperties` at their parent, while self-contained lexical objects
# keep `additionalProperties`.
enforcement:
  - id: simple_object
    schema: { type: object, properties: { name: { type: string } } }
    closure: additionalProperties
  - id: free_form_mapping
    schema: { type: object }
    closure: none
  - id: composed_object
    schema:
      allOf:
        - { type: object, properties: { first: { type: string } } }
        - { type: object, properties: { last: { type: string } } }
    closure: unevaluatedProperties
  - id: conditional_object
    schema:
      type: object
      required: [kind]
      properties:
        kind: { enum: [plain, special] }
        extra: { type: string }
      allOf:
        - if: { properties: { kind: { const: special } }, required: [kind] }
          then: { required: [extra] }
    closure: unevaluatedProperties
  - id: alternative_object
    schema:
      anyOf:
        - { type: object, required: [a], properties: { a: { type: string } } }
        - { type: object, required: [b], properties: { b: { type: string } } }
    closure: unevaluatedProperties
  - id: direct_conditional
    schema:
      properties: { kind: { enum: [plain, special] } }
      if: { properties: { kind: { const: special } }, required: [kind] }
      then: { properties: { extra: { type: string } } }
    closure: unevaluatedProperties
  - id: ref_from_fragment
    schema:
      allOf:
        - { $ref: "#/$defs/Address" }
      $defs:
        Address: { type: object, properties: { street: { type: string } } }
    # Every reference to Address runs through a fragment, so Address is a fragment by
    # use and is left open; the root closes over it instead, which annotations make
    # correct. Following the `$ref` is what lets the root know it declares anything.
    closure: unevaluatedProperties
    defs_closure:
      Address: none
  - id: ref_extension_idiom
    # The commonest composed shape in the wild: extend a base definition with one more
    # branch. Closing Address lexically would reject `extra`, declared one branch over.
    schema:
      allOf:
        - { $ref: "#/$defs/Address" }
        - { properties: { extra: { type: string } } }
      $defs:
        Address: { type: object, properties: { street: { type: string } } }
    closure: unevaluatedProperties
    defs_closure:
      Address: none
  - id: ref_from_both_contexts
    # Reached from a fragment and from `properties`. The definition remains reusable
    # and open; each referring site receives annotation-aware closure independently.
    schema:
      type: object
      properties:
        addr: { $ref: "#/$defs/Address" }
      allOf:
        - { $ref: "#/$defs/Address" }
      $defs:
        Address: { type: object, properties: { street: { type: string } } }
    closure: unevaluatedProperties
    defs_closure:
      Address: none
  - id: ref_to_free_form_def
    # The reference resolves to a free-form mapping, so it declares nothing and the
    # root must stay open. Assuming any `$ref` declares something would close this
    # schema against every key.
    schema:
      allOf:
        - { $ref: "#/$defs/Anything" }
      $defs:
        Anything: { type: object }
    closure: none
    defs_closure:
      Anything: none
  - id: ref_adjacent_to_properties
    # `$ref` is an in-place applicator, so its annotations reach the referring node.
    # A node that both references and declares needs the annotation-aware keyword, and
    # the definition it composes with must stay open for the same reason as the
    # extension idiom above.
    schema:
      $ref: "#/$defs/Address"
      properties: { extra: { type: string } }
      $defs:
        Address: { type: object, properties: { street: { type: string } } }
    closure: unevaluatedProperties
    defs_closure:
      Address: none
  - id: standalone_ref_closes_its_definition
    # The only reference is a bare property value. The reference application site closes
    # with `unevaluatedProperties`; the reusable definition itself remains open.
    schema:
      type: object
      properties:
        addr: { $ref: "#/$defs/Address" }
      $defs:
        Address: { type: object, properties: { street: { type: string } } }
    closure: additionalProperties
    defs_closure:
      Address: none
  - id: prohibition_only
    # `not` names what must be absent. Those properties are not declarations, and `not`
    # contributes no annotations, so closing over them would admit nothing at all.
    schema:
      type: object
      not: { properties: { b: { type: string } }, required: [b] }
    closure: none
  - id: dependent_object
    schema:
      type: object
      properties: { a: { type: string } }
      dependentSchemas:
        a: { required: [b], properties: { b: { type: string } } }
    closure: unevaluatedProperties
  - id: pattern_object
    schema:
      type: object
      patternProperties: { "^x_": { type: string } }
    closure: additionalProperties

# Raw-versus-enforced outcomes are the primary semantic oracle. A valid authored schema
# may narrow only because a present property is unevaluated; an invalid authored schema
# must never become valid. `unsupported` is the checked profile's explicit answer when
# it cannot prove a safe placement.
enforcement_semantics:
  - id: anyof_collects_all_successful_annotations
    schema:
      anyOf:
        - { type: object, required: [a], properties: { a: { type: string } } }
        - { type: object, required: [b], properties: { b: { type: string } } }
    value: { a: x, b: y }
    raw: valid
    enforced: valid
  - id: anyof_rejects_only_the_unevaluated_key
    schema:
      anyOf:
        - { type: object, required: [a], properties: { a: { type: string } } }
        - { type: object, required: [b], properties: { b: { type: string } } }
    value: { a: x, b: y, bogus: 1 }
    raw: valid
    enforced: invalid
    properties: [bogus]
  - id: oneof_branch_selection_is_preserved
    schema:
      oneOf:
        - { type: object, properties: { a: { type: string } } }
        - { type: object, properties: { b: { type: string } } }
    value: { a: x }
    raw: invalid
    enforced: invalid
  - id: oneof_reference_target_would_change_selection
    schema:
      oneOf:
        - { $ref: "#/$defs/NestedBranch" }
        - { type: object, properties: { child: true } }
      $defs:
        NestedBranch:
          type: object
          properties:
            child:
              type: object
              properties: { x: { type: number } }
    value: { child: { x: 1, detail: changes-selection } }
    raw: invalid
    enforced: unsupported
    reason: composition_reference_context
  - id: allof_reference_target_would_change_nested_intersection
    schema:
      allOf:
        - { $ref: "#/$defs/NestedBranch" }
        - properties:
            child:
              type: object
              properties: { detail: { type: string } }
              additionalProperties: true
      $defs:
        NestedBranch:
          type: object
          properties:
            child:
              type: object
              properties: { x: { type: number } }
    value: { child: { x: 1, detail: declared-by-sibling } }
    raw: valid
    enforced: unsupported
    reason: composition_reference_context
  - id: conditional_reference_target_would_change_branch_success
    schema:
      type: object
      properties:
        kind: { type: string }
        child:
          type: object
          properties: { detail: { type: string } }
          additionalProperties: true
      if: { properties: { kind: { const: special } }, required: [kind] }
      then: { $ref: "#/$defs/NestedBranch" }
      $defs:
        NestedBranch:
          type: object
          properties:
            child:
              type: object
              properties: { x: { type: number } }
    value: { kind: special, child: { x: 1, detail: declared-at-parent } }
    raw: valid
    enforced: unsupported
    reason: composition_reference_context
  - id: reference_with_validation_sibling_reaches_modified_target
    schema:
      $ref: "#/$defs/NestedBranch"
      properties:
        child:
          type: object
          properties: { detail: { type: string } }
          additionalProperties: true
      $defs:
        NestedBranch:
          type: object
          properties:
            child:
              type: object
              properties: { x: { type: number } }
    value: { child: { x: 1, detail: declared-by-sibling } }
    raw: valid
    enforced: unsupported
    reason: composition_reference_context
  - id: mixed_reference_contexts_do_not_interfere
    schema:
      type: object
      properties: { addr: { $ref: "#/$defs/Address" } }
      allOf:
        - { $ref: "#/$defs/Address" }
        - { properties: { extra: { type: string } } }
      $defs:
        Address: { type: object, properties: { street: { type: string } } }
    value: { street: s, extra: x }
    raw: valid
    enforced: valid
  - id: reference_site_explicit_opt_out
    schema:
      $ref: "#/$defs/Base"
      unevaluatedProperties: true
      $defs:
        Base: { type: object, properties: { street: { type: string } } }
    value: { street: s, extra: 1 }
    raw: valid
    enforced: valid
  - id: nullable_reference_to_explicitly_closed_generated_graph
    # Pydantic and Zod commonly encode `Model | null` as `anyOf: [$ref, null]`.
    # Every structured object is already explicit here, so checked enforcement has
    # nothing to infer and must not refuse the nullable reference context.
    schema:
      type: object
      additionalProperties: false
      properties:
        company_facts:
          anyOf:
            - { $ref: "#/$defs/CompanyFacts" }
            - { type: "null" }
      $defs:
        CompanyFacts:
          type: object
          additionalProperties: false
          properties:
            brands:
              type: array
              items: { $ref: "#/$defs/CompanyBrand" }
        CompanyBrand:
          type: object
          additionalProperties: false
          properties: { name: { type: string } }
    value: { company_facts: { brands: [{ name: Acme }] } }
    raw: valid
    enforced: valid
  - id: nested_nullable_references_to_closed_generated_models
    schema:
      type: object
      additionalProperties: false
      properties:
        omissions:
          anyOf:
            - { $ref: "#/$defs/Omissions" }
            - { type: "null" }
          default: null
      $defs:
        Omissions:
          type: object
          additionalProperties: false
          properties:
            failure:
              anyOf:
                - { $ref: "#/$defs/Failure" }
                - { type: "null" }
              default: null
        Failure:
          type: object
          additionalProperties: false
          properties: { message: { type: string } }
    value: { omissions: { failure: { message: original } } }
    raw: valid
    enforced: valid
  - id: nested_nullable_closed_models_accept_null
    schema:
      type: object
      additionalProperties: false
      properties:
        omissions:
          anyOf:
            - { $ref: "#/$defs/Omissions" }
            - { type: "null" }
      $defs:
        Omissions:
          type: object
          additionalProperties: false
          properties:
            failure:
              anyOf:
                - { $ref: "#/$defs/Failure" }
                - { type: "null" }
        Failure:
          type: object
          additionalProperties: false
          properties: { message: { type: string } }
    value: { omissions: { failure: null } }
    raw: valid
    enforced: valid
  - id: nested_nullable_closed_models_reject_unknown_properties
    schema:
      type: object
      additionalProperties: false
      properties:
        omissions:
          anyOf:
            - { $ref: "#/$defs/Omissions" }
            - { type: "null" }
      $defs:
        Omissions:
          type: object
          additionalProperties: false
          properties:
            failure:
              anyOf:
                - { $ref: "#/$defs/Failure" }
                - { type: "null" }
        Failure:
          type: object
          additionalProperties: false
          properties: { message: { type: string } }
    value: { omissions: { failure: { message: original, extra: 1 } } }
    raw: invalid
    enforced: invalid
  - id: nested_nullable_oneof_preserves_explicit_open_policy
    schema:
      type: object
      additionalProperties: false
      properties:
        omissions:
          anyOf:
            - { $ref: "#/$defs/Omissions" }
            - { type: "null" }
      $defs:
        Omissions:
          type: object
          additionalProperties: false
          properties:
            failure:
              oneOf:
                - { type: "null", description: No failure }
                - { $ref: "#/$defs/Failure", title: Failure }
              default: null
        Failure:
          type: object
          additionalProperties: true
          properties: { message: { type: string } }
    value: { omissions: { failure: { message: original, extra: 1 } } }
    raw: valid
    enforced: valid
  - id: nullable_wrapper_validation_siblings_still_require_safety_analysis
    schema:
      type: object
      additionalProperties: false
      properties:
        omissions:
          anyOf:
            - { $ref: "#/$defs/Omissions" }
            - { type: "null" }
      $defs:
        Omissions:
          type: object
          additionalProperties: false
          properties:
            failure:
              anyOf:
                - { $ref: "#/$defs/Failure" }
                - { type: "null" }
              properties: { message: { type: string } }
        Failure:
          type: object
          additionalProperties: false
          properties: { message: { type: string } }
    value: { omissions: { failure: { message: original } } }
    raw: valid
    enforced: unsupported
    reason: composition_reference_context
  - id: pattern_only_object
    schema:
      type: object
      patternProperties: { "^x_": { type: string } }
    value: { x_ok: yes, bogus: 1 }
    raw: valid
    enforced: invalid
    properties: [bogus]
  - id: reference_with_sibling_pattern
    schema:
      $ref: "#/$defs/Base"
      patternProperties: { "^x_": { type: string } }
      $defs:
        Base: { type: object, properties: { street: { type: string } } }
    value: { street: s, x_ok: yes }
    raw: valid
    enforced: valid
  - id: overlapping_patterns
    schema:
      type: object
      patternProperties:
        "^x": { type: string }
        "ok$": { minLength: 2 }
    value: { x_ok: yes }
    raw: valid
    enforced: valid
  - id: array_items_close_each_element
    schema:
      type: array
      items:
        type: object
        properties: { name: { type: string } }
    value: [{ name: Ada, bogus: 1 }]
    raw: valid
    enforced: invalid
    errors:
      - { code: undeclared_property, path: [0], property: bogus }
  - id: prefix_items_and_items_are_disjoint
    schema:
      type: array
      prefixItems:
        - { type: object, properties: { head: { type: string } } }
      items: { type: object, properties: { tail: { type: string } } }
    value: [{ head: first }, { tail: second }]
    raw: valid
    enforced: valid
  - id: contains_is_a_matcher
    schema:
      type: array
      contains:
        type: object
        required: [match]
        properties: { match: { const: true } }
    value: [{ match: true, detail: stays-open }]
    raw: valid
    enforced: valid
  - id: contains_nested_object_requires_explicit_closure
    schema:
      type: array
      contains:
        type: object
        properties:
          nested:
            type: object
            properties: { x: { type: number } }
    value: [{ nested: { x: 1, detail: changes-match } }]
    raw: valid
    enforced: unsupported
    reason: nested_instance_composition
  - id: contains_reference_target_would_change_match
    schema:
      type: array
      contains: { $ref: "#/$defs/Element" }
      $defs:
        Element:
          type: object
          properties:
            nested:
              type: object
              properties: { x: { type: number } }
    value: [{ nested: { x: 1, detail: changes-match } }]
    raw: valid
    enforced: unsupported
    reason: composition_reference_context
  - id: items_and_contains_child_overlap
    schema:
      type: array
      items:
        type: object
        properties: { a: { type: string } }
      contains:
        type: object
        required: [b]
        properties: { b: { type: number } }
    value: [{ a: x, b: 1 }]
    raw: valid
    enforced: unsupported
    reason: child_evaluator_overlap
  - id: literal_and_pattern_child_overlap
    schema:
      type: object
      properties:
        ab: { type: object, properties: { x: { type: number } } }
      patternProperties:
        "^a": { type: object, properties: { y: { type: number } } }
    value: { ab: { x: 1, y: 2 } }
    raw: valid
    enforced: unsupported
    reason: child_evaluator_overlap
  - id: structured_pattern_pair_is_refused_conservatively
    schema:
      type: object
      patternProperties:
        "^x": { type: object, properties: { left: { type: number } } }
        "^y": { type: object, properties: { right: { type: number } } }
    value: { x_key: { left: 1 } }
    raw: valid
    enforced: unsupported
    reason: child_evaluator_overlap
  - id: conditional_branch_declaration_is_success_sensitive
    schema:
      type: object
      properties: { kind: { enum: [plain, special] } }
      if: { properties: { kind: { const: special } }, required: [kind] }
      then:
        required: [extra]
        properties: { extra: { type: string } }
    value: { kind: plain, extra: fine }
    raw: valid
    enforced: invalid
    properties: [extra]
  - id: anchor_reference_extension
    schema:
      allOf:
        - { $ref: "#Base" }
        - { properties: { extra: { type: string } } }
      $defs:
        Base:
          $anchor: Base
          type: object
          properties: { street: { type: string } }
    value: { street: s, extra: x }
    raw: valid
    enforced: valid
  - id: escaped_pointer_extension
    schema:
      allOf:
        - { $ref: "#/$defs/a~1b" }
        - { properties: { extra: { type: string } } }
