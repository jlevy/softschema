# Engine differences on degenerate schemas that the reach rule does not remove. Each
# runtime asserts its own listed result exactly, so a listed difference passes, drift on
# either side fails (including drift that makes the engines agree, which is the signal to
# move the case into `cases`), and an unlisted difference has nothing to pass against.
# Raw mode; omitted error fields mean the layer reports no error. `softschema compile`
# produces none of these shapes. A side whose result is ok exits 0 there; every other
# side exits 1.
engine_deviations:
  # Ajv compiles nothing for a subschema that can never apply; jsonschema evaluates it
  # whenever the payload reaches it. The walk follows Ajv, so these fail in Python only
  # during evaluation.
  - name: inert-contains-dangling-reference-reached
    values: {name: hello, items: [1]}
    schema:
      type: object
      properties:
        name: {type: string}
        items: {type: array, contains: {$ref: "#/$defs/Missing"}, minContains: 0}
    why: >-
      `minContains: 0` with no `maxContains` makes `contains` a no-op in Ajv, which
      compiles nothing for it; jsonschema still evaluates the subschema against each item.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: impossible-contains-dangling-reference-reached
    values: {name: hello, items: [1]}
    schema:
      type: object
      properties:
        name: {type: string}
        items:
          type: array
          contains: {$ref: "#/$defs/Missing"}
          minContains: 2
          maxContains: 1
    why: >-
      `minContains > maxContains` fails every array in Ajv without compiling the
      subschema; jsonschema evaluates the subschema first.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: false, error_kind: schema_violation}
  - name: unevaluated-properties-beside-additional-properties-reached
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      additionalProperties: true
      unevaluatedProperties: {$ref: "#/$defs/Missing"}
    why: &unevaluated_beside_additional_why >-
      A sibling `additionalProperties`, `true` or `false`, has evaluated every property,
      so Ajv compiles nothing for `unevaluatedProperties`; jsonschema still evaluates its
      subschema. To find the evaluated keys, jsonschema descends every instance value into
      the `unevaluatedProperties` subschema itself, so it resolves that subschema's
      reference as soon as the payload has one property, whatever `additionalProperties`
      says and whether or not any property is left unevaluated.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: unevaluated-properties-beside-closed-additional-properties-reached
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      additionalProperties: false
      unevaluatedProperties: {$ref: "#/$defs/Missing"}
    why: *unevaluated_beside_additional_why
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: unevaluated-items-beside-contains-reached
    values: {name: hello, items: [1]}
    schema:
      type: object
      properties:
        name: {type: string}
        items:
          type: array
          contains: {type: integer}
          unevaluatedItems: {$ref: "#/$defs/Missing"}
    why: >-
      A compiled sibling `contains` marks every item evaluated in Ajv, which then compiles
      nothing for `unevaluatedItems`; jsonschema still evaluates its subschema.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: unevaluated-properties-after-allof-closure
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      allOf: [{additionalProperties: true}]
      unevaluatedProperties: {$ref: "#/$defs/Missing"}
    why: >-
      Ajv tracks evaluated properties through `allOf`, so the member's
      `additionalProperties` lets it skip `unevaluatedProperties`. The walk models only a
      sibling `additionalProperties`, follows this subschema, and refuses the schema.
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: lone-if-dangling-reference
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      if: {$ref: "#/$defs/Missing"}
    why: >-
      jsonschema evaluates an `if` with no `then` or `else` and so resolves its reference
      lazily; Ajv compiles nothing for it. The reach rule follows what both engines
      evaluate, so the walk does not visit a lone `if`: Python fails during evaluation
      while TypeScript completes.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: if-with-empty-then-dangling-reference
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      if: {$ref: "#/$defs/Missing"}
      then: {}
    why: &trivial_branch_why >-
      Ajv also ignores an `if` whose `then` and `else` are schemas it has no rule for:
      `true`, `{}`, or a schema holding only annotations or keywords Ajv does not
      validate. The reach rule counts any present `then` or `else`, so the walk resolves
      the reference and Python refuses the schema before evaluation.
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: if-with-true-then-dangling-reference
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      if: {$ref: "#/$defs/Missing"}
      then: true
    why: *trivial_branch_why
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: if-with-annotation-then-dangling-reference
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      if: {$ref: "#/$defs/Missing"}
      then: {title: Branch, description: Nothing to validate}
    why: *trivial_branch_why
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: if-with-annotation-else-dangling-reference
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {type: string}
      if: {$ref: "#/$defs/Missing"}
      else: {description: Nothing to validate}
    why: *trivial_branch_why
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: dynamic-ref-missing-anchor-typed-root
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {$dynamicRef: "#missing"}
    why: >-
      jsonschema resolves a `$dynamicRef` like a `$ref` and fails on the missing anchor;
      Ajv falls back to the root schema, so the property value is checked against the
      root and rejected as not an object. The enforced profile refuses `$dynamicRef`
      outright.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: false, error_kind: schema_violation}
  - name: dynamic-ref-missing-anchor-untyped-root
    values: {name: hello}
    schema:
      properties:
        name: {$dynamicRef: "#missing"}
    why: >-
      The same Ajv fallback as above, but an untyped root accepts the property value, so
      the verdicts differ, not only the records.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: reference-to-non-schema-location
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {$ref: "#/properties/other/type"}
        other: {type: string}
    why: >-
      The target is the string "string", not a schema. jsonschema fails while evaluating
      it; Ajv compiles it as an empty schema and accepts.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: compilation}
    typescript: {execution: completed, ok: true}
  - name: id-and-ref-siblings
    values: {name: hello}
    schema:
      type: object
      properties:
        name: {$id: "https://example.com/name.json", $ref: "#/$defs/S"}
      $defs:
        S: {type: string}
    why: >-
      The `$ref` resolves against its sibling `$id`, where `#/$defs/S` does not exist, so
      the schema is unresolvable in both engines. Python's walk reports the missing
      pointer; Ajv overflows its stack compiling the node and reports the overflow.
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: compilation}
  - name: embedded-id-with-resolvable-ref-sibling
    values: {name: hello}
    schema:
      $id: https://example.com/root.json
      type: object
      properties:
        name: {type: string}
        item:
          $id: dir/item.json
          $ref: "#/$defs/x"
          $defs:
            x: {type: string}
    why: >-
      Valid Draft 2020-12, and the spec's reference-context rules allow `$id` on a pure
      `$ref` site, so Python resolves the reference inside the embedded resource and
      completes. Ajv overflows its stack compiling a node that is both a resource and a
      reference, in raw and enforced mode alike, so TypeScript refuses the schema.
    python: {execution: completed, ok: true}
    typescript: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: compilation}
  # A relative `$id` under a non-hierarchical root `$id` gets a different id in each
  # engine: `referencing` joins ids with Python's `urljoin`, which leaves the reference
  # unchanged under such a base, while Ajv joins it per RFC 3986 with fast-uri. The
  # enforced profile refuses the relative id in both runtimes as `reference`.
  - name: urn-root-nested-relative-id
    values: {name: hello, item: {v: s}}
    schema:
      $id: urn:example:root
      type: object
      properties:
        name: {type: string}
        item: {$ref: "#/$defs/Item"}
      $defs:
        Item:
          $id: dir/item.json
          properties:
            v: {$ref: "#/$defs/V"}
          $defs:
            V: {type: string}
    why: >-
      Python keeps `dir/item.json` as the embedded resource's id, resolves the `$ref`
      inside it, and completes. Ajv resolves the id to `urn:dir/item.json`, a URN with no
      namespace identifier, and fast-uri throws `URN without nid cannot be serialized`
      when Ajv resolves the `$ref` inside that resource, so TypeScript refuses the schema
      whether or not the payload reaches it. The identity grammar reads each `$id` as
      written, and both ids here follow it.
    python: {execution: completed, ok: true}
    typescript: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: compilation}
  - name: urn-root-relative-child-id-joining-to-root
    values: {name: hello}
    schema:
      $id: urn:example:dir/item.json
      type: object
      properties:
        name: {$ref: item.json}
      $defs:
        Item: {$id: item.json, type: string}
    why: >-
      Ajv joins the relative `item.json` onto the root's last path segment, which gives
      the root's own id, and refuses the duplicate resource while compiling. Python keeps
      the nested id relative, resolves the `$ref` to it, and completes.
    python: {execution: completed, ok: true}
    typescript: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: compilation}
  - name: tag-root-nested-relative-id-absolute-reference
    values: {name: hello, item: {v: s}}
    schema:
      $id: "tag:example.com,2026:root"
      type: object
      properties:
        name: {type: string}
        item: {$ref: "tag:dir/item.json"}
      $defs:
        Item:
          $id: dir/item.json
          properties:
            v: {type: string}
    why: >-
      Ajv gives the embedded resource the id `tag:dir/item.json`, so a `$ref` to that URI
      resolves and TypeScript completes. Python's id for it stays `dir/item.json`, the
      walk finds no resource at `tag:dir/item.json`, and Python refuses the schema. A
      local `$ref` inside the resource resolves in both runtimes, as the
      `tag-root-nested-relative-id-local-reference` case shows.
    python: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: completed, ok: true}
  - name: reference-cycle
    values: {name: hello}
    schema:
      $ref: "#/$defs/A"
      $defs:
        A: {$ref: "#/$defs/B"}
        B: {$ref: "#/$defs/A"}
    why: >-
      Every reference resolves, so the walk passes, and both engines then recurse without
      end: Ajv while compiling (not_run), jsonschema while evaluating (errored).
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: compilation}
    typescript: {execution: not_run, ok: false, error_kind: schema_invalid, error_reason: compilation}
  - name: root-dynamic-reference
    values: {name: hello}
    schema: {$dynamicRef: "#dynamic"}
    why: >-
      Both engines fail during evaluation. jsonschema reports the missing anchor; Ajv
      falls back to the root, recurses without end, and reports the overflow.
    python: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: reference}
    typescript: {execution: errored, ok: false, error_kind: schema_invalid, error_reason: compilation}
