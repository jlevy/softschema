# Actual payload-check progress, independent of declared mode and overall outcome.
cases:
  - name: metadata-only-enforced
    values: {name: hello}
    structural: {execution: not_run, ok: true, skipped_reason: no_schema}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    warning: document-enforcement-not-applied
  - name: metadata-only-soft
    values: {name: hello}
    status: soft
    structural: {execution: not_run, ok: true, skipped_reason: no_schema}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: model-only-accepts
    values: {name: hello}
    model: true
    structural: {execution: not_run, ok: true, skipped_reason: inferred_via_model}
    semantic: {execution: completed, ok: true, skipped_reason: null}
    warning: document-enforcement-via-model-only
  - name: model-only-rejects
    values: {name: rejected}
    model: true
    structural: {execution: not_run, ok: true, skipped_reason: inferred_via_model}
    semantic: {execution: completed, ok: false, skipped_reason: null}
    warning: document-enforcement-via-model-only
  - name: schema-only-accepts
    values: {name: hello}
    schema: &sample_schema
      type: object
      properties:
        name: {type: string}
      required: [name]
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: schema-only-rejects
    values: {name: 42}
    schema: *sample_schema
    structural: {execution: completed, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: both-accept
    values: {name: hello}
    schema: *sample_schema
    model: true
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: completed, ok: true, skipped_reason: null}
  - name: semantic-rejects-after-schema-accepts
    values: {name: rejected}
    schema: *sample_schema
    model: true
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: completed, ok: false, skipped_reason: null}
  - name: both-reject
    values: {name: 42}
    schema: *sample_schema
    model: true
    structural: {execution: completed, ok: false, skipped_reason: null}
    semantic: {execution: completed, ok: false, skipped_reason: null}
  - name: missing-schema-model-accepts
    values: {name: hello}
    missing_schema: true
    model: true
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: completed, ok: true, skipped_reason: null}
    error_kind: schema_missing
    warning: document-enforcement-via-model-only
  - name: malformed-schema-model-rejects
    values: {name: rejected}
    schema_text: "["
    model: true
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: completed, ok: false, skipped_reason: null}
    error_kind: schema_invalid
    warning: document-enforcement-via-model-only
  - name: invalid-schema-dialect
    values: {name: hello}
    schema: {type: unknown}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    warning: document-enforcement-not-applied
  - name: unsupported-enforced-schema
    values: {name: hello}
    schema: {$dynamicRef: "#dynamic"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: enforcement_unsupported
    warning: document-enforcement-not-applied
  # Both engines resolve every reference that evaluation could reach before any payload
  # is checked: Ajv while compiling, jsonschema through an eager preparation walk.
  - name: unresolved-reference
    values: {name: hello}
    status: soft
    schema: {$ref: "#/$defs/Missing"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: reference
  - name: unreached-local-reference
    values: {name: hello}
    status: soft
    schema: &unreached_local_reference
      type: object
      properties:
        name: {type: string}
        extra: {$ref: "#/$defs/Missing"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: reference
  - name: unreached-remote-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {type: string}
        extra: {$ref: "https://example.invalid/missing.json"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: reference
  # A URN with no namespace identifier cannot be resolved: jsonschema finds no resource
  # for it, and Ajv's URI library cannot serialize it.
  - name: malformed-urn-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {$ref: "urn:dir/item.json"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: reference
  - name: unreferenced-definition-dangling-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {type: string}
      $defs:
        Unused: {$ref: "#/$defs/Missing"}
    # Neither engine evaluates a definition nothing references.
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  # Base URIs: a lookup target arrives with a resolver already scoped to it, so its own
  # directory-bearing relative $id must not be joined a second time (dir/dir/item.json).
  - name: nested-relative-id-reference-reached
    values: {name: hello, item: {x: y}}
    status: soft
    schema: &nested_relative_id
      type: object
      properties:
        name: {type: string}
        item: {$ref: "dir/item.json"}
      $defs:
        Item:
          $id: dir/item.json
          type: object
          properties:
            x: {$ref: "#/$defs/X"}
          $defs:
            X: {type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: nested-relative-id-reference-unreached
    values: {name: hello}
    status: soft
    schema: *nested_relative_id
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: nested-relative-id-reference-rejects
    values: {name: hello, item: {x: 1}}
    status: soft
    schema: *nested_relative_id
    structural: {execution: completed, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_violation
  # A resource reached structurally does enter its $id, so its internal reference resolves.
  - name: embedded-id-resource-internal-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name:
          $id: https://example.com/name.json
          $defs:
            Name: {type: string}
          allOf: [{$ref: "#/$defs/Name"}]
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  # Reach follows what both engines evaluate: contentSchema is an annotation, and then or
  # else without if is inert, so a dangling reference there is not checked...
  - name: content-schema-dangling-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {type: string, contentSchema: {$ref: "#/$defs/Missing"}}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: then-without-if-dangling-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {type: string}
      then: {$ref: "#/$defs/Missing"}
      else: {$ref: "#/$defs/Missing"}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  # ...while then beside an if is compiled by both engines even when if does not fire.
  - name: then-with-if-dangling-reference
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {type: string}
      if: {required: [other]}
      then: {$ref: "#/$defs/Missing"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: reference
  # Keywords only one engine would honor are refused before either engine runs.
  - name: legacy-dependencies-keyword
    values: {name: hello, other: 1}
    status: soft
    schema:
      type: object
      dependencies:
        other: {required: [x]}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: draft-07-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: "http://json-schema.org/draft-07/schema#"
      type: object
      definitions:
        Name: {type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: draft-2020-12-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        name: {type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  # A root that references itself resolves, then recurses without end in both engines
  # during evaluation: errored, with the overflow reported as a compilation failure.
  - name: root-self-reference
    values: {name: hello}
    status: soft
    schema: {$ref: "#"}
    structural: {execution: errored, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: compilation
  # A caller requirement turns a layer that did not complete into a failing record.
  - name: unreached-reference-required-structural
    values: {name: hello}
    status: soft
    require: [structural]
    schema: *unreached_local_reference
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: reference
  - name: metadata-only-enforced-required
    values: {name: hello}
    require: [structural]
    structural: {execution: not_run, ok: false, skipped_reason: no_schema}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: check_not_completed
    warning: document-enforcement-not-applied
  - name: metadata-only-required-semantic
    values: {name: hello}
    require: [semantic]
    structural: {execution: not_run, ok: true, skipped_reason: no_schema}
    semantic: {execution: not_run, ok: false, skipped_reason: no_semantic_model}
    warning: document-enforcement-not-applied
  - name: schema-accepts-required-structural
    values: {name: hello}
    require: [structural]
    schema: *sample_schema
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: schema-rejects-required-structural
    values: {name: 42}
    require: [structural]
    schema: *sample_schema
    structural: {execution: completed, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_violation
  - name: model-only-required-both
    values: {name: hello}
    require: [structural, semantic]
    model: true
    structural: {execution: not_run, ok: false, skipped_reason: inferred_via_model}
    semantic: {execution: completed, ok: true, skipped_reason: null}
    error_kind: check_not_completed
    warning: document-enforcement-via-model-only
  - name: missing-schema-required-structural
    values: {name: hello}
    require: [structural, semantic]
    missing_schema: true
    model: true
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: completed, ok: true, skipped_reason: null}
    error_kind: schema_missing
    warning: document-enforcement-via-model-only
  - name: malformed-schema-required-structural
    values: {name: hello}
    require: [structural]
    status: soft
    schema_text: "["
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
  # Keywords only Ajv would honor are refused in both runtimes before either engine runs.
  - name: nullable-keyword
    values: {name: null}
    status: soft
    schema:
      type: object
      properties:
        name: {type: string, nullable: true}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: property-named-nullable
    values: {nullable: true}
    status: soft
    schema:
      type: object
      properties:
        nullable: {type: boolean}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: recursive-ref-keyword
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {$recursiveRef: "#"}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: recursive-anchor-keyword
    values: {name: hello}
    status: soft
    schema:
      $recursiveAnchor: true
      type: object
      properties:
        name: {type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: non-string-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: 12
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  # Unhashable values must be refused by type, not by a failed set lookup.
  - name: array-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: []
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: mapping-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: {}
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: nested-mapping-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {$schema: {}, type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: null-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: null
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: boolean-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: true
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  - name: http-2020-12-schema-keyword
    values: {name: hello}
    status: soft
    schema:
      $schema: "http://json-schema.org/draft/2020-12/schema"
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: dialect
  # A relative root $id has no base; the engines would invent different ones.
  - name: relative-root-id
    values: {item: {v: x}}
    status: soft
    schema:
      $id: schemas/root.json
      type: object
      properties:
        item: {$ref: "#/$defs/Item"}
      $defs:
        Item:
          $id: dir/item.json
          properties:
            v: {$ref: "#/$defs/V"}
          $defs:
            V: {type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: absolute-root-id-nested-relative-id
    values: {item: {v: x}}
    status: soft
    schema:
      $id: https://example.com/schemas/root.json
      type: object
      properties:
        item: {$ref: "#/$defs/Item"}
      $defs:
        Item:
          $id: dir/item.json
          properties:
            v: {$ref: "#/$defs/V"}
          $defs:
            V: {type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: tag-root-nested-relative-id-local-reference
    values: {name: hello, item: {v: s}}
    status: soft
    schema:
      $id: "tag:example.com,2026:root"
      type: object
      properties:
        name: {type: string}
        item: {$ref: "#/$defs/Item"}
      $defs:
        Item:
          $id: dir/item.json
          properties:
            v: {$ref: "#/$defs/V"}
          $defs:
            V: {type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: urn-root-id
    values: {name: hello}
    status: soft
    schema:
      $id: urn:example:root
      type: object
      properties:
        name: {type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  # A urn: $id names a namespace identifier (urn:<nid>:<name>). Ajv's URI library cannot
  # serialize one that does not, so both runtimes refuse it, root or nested.
  - name: urn-root-id-without-namespace
    values: {name: hello}
    status: soft
    schema:
      $id: urn:example
      type: object
      properties:
        name: {type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: urn-root-id-with-path-for-namespace
    values: {name: hello}
    status: soft
    schema:
      $id: urn:dir/item.json
      type: object
      properties:
        name: {type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: urn-nested-id-without-namespace
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {$id: "urn:example", type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: urn-root-id-without-namespace-enforced
    values: {name: hello}
    schema:
      $id: urn:example
      type: object
      properties:
        name: {type: string}
      required: [name]
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
    warning: document-enforcement-not-applied
  - name: urn-uuid-root-id
    values: {name: hello}
    status: soft
    schema:
      $id: urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
      type: object
      properties:
        name: {type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: urn-uuid-root-id-enforced
    values: {name: hello}
    schema:
      $id: urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
      type: object
      properties:
        name: {type: string}
      required: [name]
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  - name: urn-isbn-nested-id
    values: {name: hello}
    status: soft
    schema:
      type: object
      properties:
        name: {$id: "urn:isbn:0451450523", type: string}
    structural: {execution: completed, ok: true, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
  # Every identity follows one grammar (tests/vectors/identities.yaml has a case per
  # rule): spellings either engine would normalize, or could not resolve against, are
  # refused before either engine runs, in raw and enforced mode alike.
  - name: uppercase-urn-scheme-root-id-self-reference
    values: {name: hello}
    status: soft
    schema:
      $id: "URN:Example:Root"
      type: object
      properties:
        name: {$ref: "URN:Example:Root#/$defs/S"}
      $defs:
        S: {type: string}
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: whitespace-prefixed-root-id
    values: {name: hello}
    status: soft
    schema:
      $id: " https://example.com/schemas/movie.json"
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: unclosed-ipv6-root-id
    values: {name: hello}
    status: soft
    schema:
      $id: "http://[::1"
      type: object
    structural: {execution: not_run, ok: false, skipped_reason: null}
    semantic: {execution: not_run, ok: true, skipped_reason: no_semantic_model}
    error_kind: schema_invalid
    error_reason: resource_identity
  - name: unclosed-ipv6-root-id-enforced
    values: {name: hello}
    schema:
      $id: "http://[::1"
      type: object
      properties:
        name: {type: string}
      required: [name]
    structural: {execution: not_run, ok: false, skipped_reason: null}
