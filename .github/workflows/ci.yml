name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  release-candidates:
    uses: ./.github/workflows/release-candidates.yml

  artifact-smoke:
    needs: release-candidates
    name: Artifact smoke (${{ matrix.os }}, py${{ matrix.python-context }}, node${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # The protected context retains its historical 3.11.15 label, but current
        # macOS-arm64 and Windows runner toolcaches do not publish that exact patch.
        # Use the latest available 3.11 patch for the supported-minor compatibility lane.
        include:
          - os: ubuntu-latest
            python-context: "3.11.15"
            python-version: "3.11"
            node-version: "22.12.0"
          - os: ubuntu-latest
            python-context: "3.14.6"
            python-version: "3.14.6"
            node-version: "24.18.0"
          - os: macos-latest
            python-context: "3.11.15"
            python-version: "3.11"
            node-version: "22.12.0"
          - os: macos-latest
            python-context: "3.14.6"
            python-version: "3.14.6"
            node-version: "24.18.0"
          - os: windows-latest
            python-context: "3.11.15"
            python-version: "3.11"
            node-version: "22.12.0"
          - os: windows-latest
            python-context: "3.14.6"
            python-version: "3.14.6"
            node-version: "24.18.0"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Download exact candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidates
          path: release-candidates

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.12"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify transferred checksums
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          for (const line of readFileSync("release-candidates/SHA256SUMS", "utf8").trim().split("\n")) {
            const match = line.match(/^([0-9a-f]{64})  (.+)$/);
            if (!match) throw new Error(`invalid checksum line: ${line}`);
            const actual = createHash("sha256").update(readFileSync(`release-candidates/${match[2]}`)).digest("hex");
            if (actual !== match[1]) throw new Error(`checksum mismatch: ${match[2]}`);
          }
          NODE

      - name: Smoke wheel and sdist outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --with "$GITHUB_WORKSPACE"/release-candidates/python/*.whl \
            softschema --version
          uv run --no-project --with "$GITHUB_WORKSPACE"/release-candidates/python/*.whl \
            softschema docs spec > /dev/null
          uv run --no-project --with "$GITHUB_WORKSPACE"/release-candidates/python/*.tar.gz \
            softschema --version
          uv run --no-project --with "$GITHUB_WORKSPACE"/release-candidates/python/*.tar.gz \
            softschema docs spec > /dev/null

      # The build job runs C-first on Linux only. Here the wheel runs with ruamel's C
      # extension on each OS and must report c-first: the gate fails closed, so a wheel
      # that silently lost the speedup on macOS or Windows would otherwise go unnoticed.
      - name: Smoke the wheel with ruamel's C extension
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --with "$GITHUB_WORKSPACE"/release-candidates/python/*.whl \
            --with 'ruamel.yaml.clib>=0.2.15' python -c '
          import sys
          from softschema import yaml_parser_mode
          from softschema._portable import yaml_parser_reason
          print(yaml_parser_mode(), "-", yaml_parser_reason())
          sys.exit(yaml_parser_mode() != "c-first")
          '

      - name: Smoke npm tarball outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir softschema-node
          cd softschema-node
          npm init --yes > /dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/release-candidates/npm/*.tgz
          node --input-type=module -e \
            'import { validateArtifact } from "softschema"; if (typeof validateArtifact !== "function") process.exit(1)'
          ./node_modules/.bin/softschema --version
          ./node_modules/.bin/softschema docs spec > /dev/null

  build:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # The JSON fast path must be on in this job: a C extension that slips into the
      # environment would otherwise skip the tests that prove it runs, with a green suite.
      SOFTSCHEMA_REQUIRE_JSON_PATH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.12"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      - name: Set supply-chain cool-off cutoff
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '14 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Install dependencies
        # These reviewed first-party packages are exempt from the global cool-off.
        # Keep their timestamps aligned with pyproject [tool.uv] exclude-newer-package.
        run: >-
          uv sync --all-extras
          --exclude-newer-package frontmatter-format=2026-08-01T01:26:20.316336Z
          --exclude-newer-package strif=2026-06-03T00:00:00Z

      - name: Run linting
        run: uv run python devtools/lint.py --check

      - name: Run tests
        run: uv run pytest

      # Tests marked `slow` are excluded from the default run (see pyproject.toml).
      - name: Run slow tests
        run: uv run pytest -m slow

      # The dev group installs ruamel's C extension, so the run above reads YAML C-first.
      # Repeat it with the pure-Python parser, which is what installs without it get.
      - name: Run tests with the pure-Python YAML parser
        env:
          SOFTSCHEMA_PURE_YAML: "1"
        run: |
          uv run pytest
          uv run pytest -m slow

      - name: Build package
        run: uv build

  golden:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.12"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      - name: Set supply-chain cool-off cutoff
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '14 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Install dependencies
        # These reviewed first-party packages are exempt from the global cool-off.
        # Keep their timestamps aligned with pyproject [tool.uv] exclude-newer-package.
        run: >-
          uv sync --all-extras
          --exclude-newer-package frontmatter-format=2026-08-01T01:26:20.316336Z
          --exclude-newer-package strif=2026-06-03T00:00:00Z

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Run golden corpus (Python CLI)
        run: SOFTSCHEMA_IMPL=py ./tests/golden/run_golden_tests.py

  dependency-audit:
    # Dependency policy is its own job so a new upstream advisory reads as a dependency
    # failure and never skips the TypeScript typecheck, tests, build, and goldens below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies (frozen, no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint:ci

      - name: Unit tests + coverage gate
        run: bun test --coverage

      - name: Build
        run: bun run build

      - name: Lint the publishable package (publint)
        run: bun run publint

      - name: Run golden corpus (TypeScript CLI under Node, the published runtime)
        working-directory: ${{ github.workspace }}
        run: SOFTSCHEMA_IMPL=ts ./tests/golden/run_golden_tests.py

      - name: Run golden corpus (TypeScript CLI under Bun)
        working-directory: ${{ github.workspace }}
        run: SOFTSCHEMA_IMPL=ts-bun ./tests/golden/run_golden_tests.py

      # Stopgap (tracked: ss-6v74): `dependency-audit` is not yet a required check in the
      # "Protect main" ruleset, so the required `typescript` check repeats the audit to keep
      # it merge-blocking. It runs last, after every test, build, and golden step, so an
      # advisory never masks those results. Remove this step once the repository owner adds
      # `dependency-audit` to the ruleset's required status checks.
      - name: Audit dependencies (stopgap until dependency-audit is required)
        run: bun audit

  cross-impl:
    # Direct Python-vs-TypeScript(Node) semantic comparison on the same inputs, so a
    # parity break is reported as a divergence instead of one side drifting from goldens.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.12"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install

      - name: Set supply-chain cool-off cutoff
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '14 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        # These reviewed first-party packages are exempt from the global cool-off.
        # Keep their timestamps aligned with pyproject [tool.uv] exclude-newer-package.
        run: >-
          uv sync --all-extras
          --exclude-newer-package frontmatter-format=2026-08-01T01:26:20.316336Z
          --exclude-newer-package strif=2026-06-03T00:00:00Z

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Build the TypeScript CLI
        working-directory: packages/typescript
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Cross-implementation parity diff
        run: bash tests/golden/cross-impl-diff.sh
